<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="제조1-B">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<title>제조1-B · 업데이트 중</title>
<style>
/* 🛠 점검 화면 (점검 시간 동안 index.html 자리에 있는 페이지 · 앱 기능 없음)
   점검 끝(release.json 의 at)에 GitHub가 index_next.html 로 바꾸면 → 이 페이지가 알아채고 새 버전으로 다시 열림 */
html,body{height:100%;margin:0}
body{-webkit-text-size-adjust:100%;touch-action:manipulation;font-family:-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;color:#fff;background:radial-gradient(120% 90% at 50% 0%,#24307a 0%,#0b1220 58%,#05080f 100%) fixed;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
.in{width:100%;max-width:340px;text-align:center}
.lg img{height:20px;opacity:.85}
.orb{position:relative;width:118px;height:118px;margin:30px auto 22px}
.orb::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 55%,#7aa6ff 75%,#b9a4ff 92%,transparent 100%);-webkit-mask:radial-gradient(closest-side,transparent 82%,#000 84%);mask:radial-gradient(closest-side,transparent 82%,#000 84%);animation:spin 1.2s linear infinite}
.orb::after{content:"";position:absolute;inset:18px;border-radius:50%;background:radial-gradient(circle,rgba(122,166,255,.35),rgba(122,166,255,0) 70%);animation:pulse 1.8s ease-in-out infinite}
.orb span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;letter-spacing:.12em;color:#cfdcff}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(.85);opacity:.6}50%{transform:scale(1.05);opacity:1}}
.t{font-size:23px;font-weight:900;letter-spacing:-.02em;text-shadow:0 2px 18px rgba(122,166,255,.45)}
.s{margin-top:8px;font-size:13.5px;line-height:1.6;color:#aab8d0;word-break:keep-all;white-space:pre-line}
.pd{display:inline-flex;align-items:center;gap:6px;margin-top:14px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.08);font-size:12.5px;font-weight:800;color:#cfdcff}
.pd:empty{display:none}
.cdh{margin-top:20px;font-size:12.5px;font-weight:800;color:#8ea6d8;letter-spacing:.04em}
.cdb{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:8px}
.cdb b{min-width:52px;padding:10px 0;border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.05));box-shadow:0 0 0 1px rgba(255,255,255,.12) inset;font-size:30px;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.cdb i{font-style:normal;font-size:24px;font-weight:900;color:#7aa6ff;animation:pulse 1s ease-in-out infinite}
.cdb small{display:block;font-size:10px;font-weight:700;color:#8ea6d8;margin-top:2px}
ol{display:none;list-style:none;margin:22px 0 0;padding:6px 16px;border-radius:18px;background:rgba(255,255,255,.06);text-align:left}
body.go ol{display:block}
body.go .cdw{display:none}
li{display:flex;align-items:center;gap:12px;padding:13px 0;font-size:14.5px;font-weight:700;color:#7f8ca3}
li+li{border-top:1px solid rgba(255,255,255,.07)}
li i{flex:none;position:relative;width:22px;height:22px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.18) inset}
li.run{color:#fff}
li.run i{box-shadow:none;background:conic-gradient(#7aa6ff 0 30%,rgba(255,255,255,.12) 30%);-webkit-mask:radial-gradient(closest-side,transparent 62%,#000 64%);mask:radial-gradient(closest-side,transparent 62%,#000 64%);animation:spin .9s linear infinite}
li.ok{color:#dbe6ff}
li.ok i{box-shadow:none;background:linear-gradient(140deg,#5b8cff,#8a6bff)}
li.ok i::after{content:"";position:absolute;left:8px;top:5px;width:4px;height:8px;border-right:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(45deg)}
.el{margin-top:14px;font-size:12px;color:#7f8ca3;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="in">
  <div class="lg"><img src="logo_dark.png" alt="" onerror="this.style.display='none'"></div>
  <div class="orb"><span>1-B</span></div>
  <div class="t" id="ttl">Claude 자동 업데이트 중</div>
  <div class="s" id="sub">잠시만 기다려 주세요.
업데이트가 끝나면 앱이 자동으로 다시 열려요.</div>
  <div class="pd" id="pd"></div>
  <div class="cdw"><div class="cdh">업데이트 완료까지</div><div class="cdb" id="cd"></div></div>
  <ol id="st"><li><i></i>새 버전 확인 중</li><li><i></i>새 버전 받는 중</li><li><i></i>화면 적용 중</li></ol>
  <div class="el" id="el"></div>
</div>
<script>
// 예전 앱이 이 페이지를 "새 버전"으로 알아채고 다시 열리게 하는 표시 (바뀐 점은 비워 둠 → 점검 끝난 뒤 한 번에 보여줌)
var APP_VER = "2026-10-25-4";
var APP_HISTORY = [];   // APP_HISTORY_END
function $(i) { return document.getElementById(i); }
function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }
var AT = 0, START = 0, done = false, t0 = 0, tries = 0;
function P(x) { return x ? Date.parse(String(x).trim().replace(" ", "T") + ":00+09:00") : 0; }
function when(a) { var k = new Date(a + 9 * 3600000); return (k.getUTCMonth() + 1) + "/" + k.getUTCDate() + "(" + "일월화수목금토".charAt(k.getUTCDay()) + ") " + ("0" + k.getUTCHours()).slice(-2) + ":" + ("0" + k.getUTCMinutes()).slice(-2); }
function step(i, s) { var li = $("st").children[i]; if (li) li.className = s; }
function base() { return location.pathname.replace(/[^\/]*$/, ""); }
function loadRel() {
  fetch(base() + "release.json?_=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
    if (!j) return;
    AT = P(j.at) || AT; START = P(j.start) || START;
    if (AT) $("pd").textContent = "🕐 " + when(START || AT) + (START && START < AT ? " ~ " + when(AT).slice(-5) : "");
  }).catch(function () {});
}
function tick() {
  if (done) return;
  if (!AT || Date.now() < AT) {
    var s = AT ? Math.max(0, Math.ceil((AT - Date.now()) / 1000)) : 0, h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60, b = $("cd");
    b.innerHTML = "";
    if (!AT) { b.textContent = "…"; return; }
    var put = function (v, l) { var e = el("b", null, ("0" + v).slice(-2)); e.appendChild(el("small", null, l)); b.appendChild(e); };
    if (h) { put(h, "시간"); b.appendChild(el("i", null, ":")); }
    put(m, "분"); b.appendChild(el("i", null, ":")); put(x, "초");
    return;
  }
  if (!document.body.classList.contains("go")) { document.body.classList.add("go"); step(0, "run"); t0 = Date.now(); look(); }
  $("el").textContent = "확인 " + tries + "회 · " + Math.floor((Date.now() - t0) / 1000) + "초 지남";
  if (Date.now() - t0 > 15 * 60000) $("sub").textContent = "업데이트가 조금 늦어지고 있어요.\n끝나면 자동으로 열려요.";
}
// 점검 끝 → 이 자리(index.html)에 새 버전이 올라왔는지 10초마다 확인
function look() {
  if (done) return;
  tries++;
  fetch(location.pathname + "?_=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.ok ? r.text() : ""; }).then(function (t) {
    var m = t.match(/var APP_VER = "([^"]+)"/);
    if (!m || m[1] === APP_VER) { setTimeout(look, 10000); return; }
    done = true;
    step(0, "ok"); step(1, "run");
    setTimeout(function () { step(1, "ok"); step(2, "run"); }, 900);
    setTimeout(function () { step(2, "ok"); $("ttl").textContent = "업데이트 완료"; $("sub").textContent = "새 버전으로 다시 열고 있어요…"; }, 1800);
    setTimeout(function () { location.replace(location.pathname + "?v=" + encodeURIComponent(m[1])); }, 2600);
  }).catch(function () { setTimeout(look, 10000); });
}
loadRel();
setInterval(tick, 1000); tick();
setInterval(loadRel, 5 * 60000);   // 점검 시간이 바뀌었을 수도 있어서 5분마다 다시 읽음
document.addEventListener("visibilitychange", function () { if (!document.hidden) { loadRel(); tick(); } });
</script>
</body>
</html>
