# ⏰ 예약 배포: index_next.html 을 정해진 시각에 index.html 로 바꿔 줌
# 시각은 UTC 기준 (한국 시간 - 9시간)
#   이번 예약: 한국 2026-11-01(일) 16:50  →  UTC 2026-11-01 07:50  →  cron: "50 7 1 11 *"
#   (앱 점검 끝 = release.json "at" 17:00 · GitHub 예약 실행은 몇 분~20분 늦게 돌 수 있어서 10분 일찍)
# 다음에 또 쓸 때: 아래 cron 숫자만 바꾸고 index_next.html + release.json 올리기
name: 예약 배포 (index_next → index)

on:
  schedule:
    - cron: "50 7 1 11 *"
  workflow_dispatch:   # Actions 화면에서 [Run workflow]로 바로 실행도 가능

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: index_next.html 이 있으면 index.html 로 교체
        run: |
          if [ ! -f index_next.html ]; then
            echo "index_next.html 없음 → 할 일 없음"
            exit 0
          fi
          mv -f index_next.html index.html
          git config user.name "scheduled-release"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "예약 배포: index.html 교체 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST)"
          git push
